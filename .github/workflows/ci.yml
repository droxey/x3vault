name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test ./... -count=1
      - name: Build
        run: go build -o bin/x3vault ./cmd/x3vault
      - name: Smoke test
        run: bash scripts/smoke.sh
